# MPPI baseline - ST (static build, corner/curve sub-scenes, matches
# test_atom_cbf_st_20260806.yaml's obstacles_config_path -- the static build
# defines its own fixed layout, this file is schema/API compatibility only).
# Uses the new 9x static build (2026-08-07) instead of the original 1x --
# same fixed layout, faster wall-clock. Sub-scenes split later in analysis
# via the transition field `global_avg_dist_obstacle`, not by config.
# See test_mppi_ood1_20260807.yaml for full rationale (hyperparameters, seed
# policy, placeholder policy_names).
#
# Dated/frozen config, created 2026-08-07.
test_name: "MPPI_ST_20260807"
machine_name: "personal"
seed: 78789
base_time: 1765457030

train_config_path: "./cf/train_SAC.yaml"

policy_names:
  - NEW_TR_SIMPLE_EASY_5804798      # placeholder, unused by MPPI
actor_std: 0.95

obstacles_config_path: "./cf/obstacles_simple_safw.yaml"

