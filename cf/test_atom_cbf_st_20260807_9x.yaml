# ATOM-CBF standalone baseline - ST, on the new 9x static build (created
# 2026-08-07), for a large overnight run. Same obstacles/policies/protocol
# as test_atom_cbf_st_20260806.yaml, only the build changes (1x -> 9x,
# same fixed layout, faster wall-clock) -- matches what test_mppi_st_20260807.yaml
# already uses for the ST environment this session.
test_name: "ATOM_CBF_ST_20260807"
machine_name: "personal"
seed: 78789
base_time: 1765457030

train_config_path: "./cf/train_SAC.yaml"

policy_names:
  - NEW_TR_SIMPLE_EASY_5804798      # SAC
  - NEW_TR_SIMPLEWP_EASY_5841772    # SACP
  - NEW_TR_LAGSACSIMPLE_5832028     # LagSAC
actor_std: 0.95

obstacles_config_path: "./cf/obstacles_simple_safw.yaml"

build_path: "./unity_build/9xlimoteststatic_0608_wind/UASRL.exe"
agent_config_path: "./cf/agent_test_sfg.yaml"
headless: true
worker_id: 0
decision_frame_period: 5
send_debug_action: false

total_episodes: 100
episode_queue_length: 18
accumulate_data: true

cbf: false
uf: false

atom_cbf: true
atom_checkpoint_path: "./models/atom_cbf/atom_cbf_id.pt"
atom_solver: "CLARABEL"

d_safe: 0.25
d_safe_mul: 3.0
alpha: 1.5
cbf_min_forward_velocity: 0.05

ut: 0.75
ue_path: "./unc_models/"
ue_action_type: "sample"

cuda: 0
torch_deterministic: true
metrics_log_interval: 25
save_path: "./results/"
