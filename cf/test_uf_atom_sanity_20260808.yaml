# requires test_multi.py's uf+atom_cbf validation relaxation (2026-08-08).
# Same map/build/seed as the other OOD1 baselines this session.
test_name: "UF_ATOM_SANITY"
machine_name: "personal"
seed: 78789
base_time: 1765457030

