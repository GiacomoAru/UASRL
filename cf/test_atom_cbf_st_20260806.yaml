# ATOM-CBF standalone baseline - ST (static build, corner/curve sub-scenes).
# test_multi_special.py was NOT used here: it has no atom_cbf/atom_controller
# support at all (its special_th dict is only for the UF-threshold sweep),
# so this run goes through test_multi.py like the OOD ones. The static
# build's fixed layout carries the corner/curve sub-scenes; they are split
# later in analysis via the transition field `global_avg_dist_obstacle`
# (0=ST1 angolo, 2=ST3 curva, as in data_analysis_2.ipynb), not by config.
#
# Dated/frozen config, created 2026-08-06. Do not overwrite; make a new dated
# file for any protocol change (see CODEX_HANDOFF.md / REBUTTAL_CHECKLIST.md).
test_name: "ATOM_CBF_ST_20260806"
machine_name: "personal"
seed: 78789
base_time: 1765457030

train_config_path: "./cf/train_SAC.yaml"

# PPO, PPOP and LagPPO are intentionally excluded from this baseline run
# (author's instruction, 2026-08-06): PPO_RETRAIN_7154081 and PPOWP_7167668
# are not present in this local workspace anyway (remote machine, per
# CODEX_HANDOFF.md); LagPPO is skipped on purpose even though its weights
# are local.
policy_names:
  - NEW_TR_SIMPLE_EASY_5804798      # SAC
  - NEW_TR_SIMPLEWP_EASY_5841772    # SACP
  - NEW_TR_LAGSACSIMPLE_5832028     # LagSAC
actor_std: 0.95

# Static build defines its own fixed obstacle layout; this file is kept only
# for schema/API compatibility, following the precedent in
# cf/test_base_UE_rand.yaml (also static build + obstacles_simple_safw.yaml).
obstacles_config_path: "./cf/obstacles_simple_safw.yaml"

build_path: "./unity_build/1xlimoteststatic_0608_wind/UASRL.exe"
agent_config_path: "./cf/agent_test_sfg.yaml"
headless: true
worker_id: 0
decision_frame_period: 5
send_debug_action: false

# CODEX_HANDOFF.md / REBUTTAL_CHECKLIST.md's 250 static episodes are per
# sub-scene (angolo/curva), and the static build carries both in one run
# (split later via global_avg_dist_obstacle, as in data_analysis_2.ipynb).
# So the raw run should be 500 for the definitive run, then filtered/split
# like the notebooks. TEMPORARILY set to 100 (2026-08-07): preliminary-only,
# pending the FOV-edge phi_cal fix (see follow-up task); restore to 500
# before the run whose numbers go in the paper.
total_episodes: 100
episode_queue_length: 18
accumulate_data: true

# Existing CBF and uncertainty gate stay disabled for this standalone baseline.
cbf: false
uf: false

atom_cbf: true
atom_checkpoint_path: "./models/atom_cbf/atom_cbf_id.pt"
atom_solver: "CLARABEL"

# Checked against the calibrated checkpoint before rollout (must match
# models/atom_cbf/atom_cbf_id.pt: d_safe=0.25, d_safe_multiplier=3.0, cbf_gain=1.5).
d_safe: 0.25
d_safe_mul: 3.0
alpha: 1.5
cbf_min_forward_velocity: 0.05

ut: 0.75
ue_path: "./unc_models/"
ue_action_type: "sample"

cuda: 0
torch_deterministic: true
metrics_log_interval: 50
save_path: "./results/"
